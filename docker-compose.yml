services:
  # Kafka API on 19092, schema registry on 18081. Single node, dev-container mode.
  redpanda:
    image: redpandadata/redpanda:v26.2.6
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
    ports: ["19092:19092", "18081:18081", "18082:18082"]
    volumes: ["redpanda:/var/lib/redpanda/data"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda-console:
    image: redpandadata/console:v3.13.1
    depends_on:
      redpanda: { condition: service_healthy }
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports: ["8085:8080"]

  # S3-compatible lake. MinIO withdrew its free images in September 2026;
  # RustFS is a drop-in with the same ports. Spark reaches it as s3a://lake/.
  s3:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: sightline
      RUSTFS_SECRET_KEY: sightline12345
    ports: ["9002:9000", "9003:9001"]
    volumes: ["s3data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3-init:
    image: amazon/aws-cli
    depends_on:
      s3: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: sightline
      AWS_SECRET_ACCESS_KEY: sightline12345
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "aws --endpoint-url http://s3:9000 s3api head-bucket --bucket lake 2>/dev/null
      || aws --endpoint-url http://s3:9000 s3 mb s3://lake"

  # The warehouse the dashboard reads. HTTP 8123, native 9009. The image only lets a
  # user declared through these envs connect from outside the container.
  clickhouse:
    image: clickhouse/clickhouse-server:26.10
    environment:
      CLICKHOUSE_USER: sightline
      CLICKHOUSE_PASSWORD: sightline
    ports: ["8123:8123", "9009:9000"]
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./docker/clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Traces. UI on 16689, OTLP/HTTP in on 4319.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports: ["16689:16686", "4319:4318"]

  # Pipeline metrics only; the product dashboard is Angular. Anonymous admin, no login.
  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports: ["3001:3000"]
    volumes: ["grafana:/var/lib/grafana"]

  # Orchestration: `docker compose --profile orchestrate up -d`; UI on 8082, no login.
  airflow-db:
    image: postgres:18
    profiles: ["orchestrate"]
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes: ["airflowdb:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # `airflow standalone` migrates the metadata DB and runs api-server, scheduler,
  # dag-processor and triggerer in one container; enough for a single-node demo.
  airflow:
    image: apache/airflow:3.3.2
    profiles: ["orchestrate"]
    command: ["standalone"]
    depends_on:
      airflow-db: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    ports: ["8082:8080"]
    volumes: ["./airflow/dags:/opt/airflow/dags:ro"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  redpanda:
  s3data:
  clickhouse:
  grafana:
  airflowdb:
