name: pipeline

on:
  push:
    branches: [master]
    paths: ["pipeline/**", "pyproject.toml", "uv.lock", ".github/workflows/pipeline.yml"]
  # No paths filter on pull_request: every job here is a required check on the master
  # ruleset, and a required check that never runs blocks the merge.
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy pipeline
      - run: uv run pytest
